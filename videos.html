<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technique Showcase | Beyond Authentication</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&family=Teko:wght@700&display=swap" rel="stylesheet">

    <!-- ALL CSS IS NOW EMBEDDED DIRECTLY IN THIS FILE -->
    <style>
        :root {
            --bg-color: #0d1117;
            --primary-text: #e6edf3;
            --secondary-text: #8b949e;
            --border-color: #30363d;
            --accent-color: #2f81f7;
            --accent-hover: #58a6ff;
            --header-font: 'Teko', sans-serif;
            --body-font: 'Roboto', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg-color); color: var(--primary-text); font-family: var(--body-font); line-height: 1.6; }
        main { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
        header { text-align: center; padding: 2rem 1rem; border-bottom: 1px solid var(--border-color); letter-spacing: 3px; }
        header h1 { font-family: var(--header-font); font-size: 3rem; color: var(--accent-color); }
        #final-cta { text-align: center; padding: 4rem 0; }
        #final-cta h2 { font-size: 2.5rem; margin-bottom: 0.5rem; }
        #final-cta p { font-size: 1.2rem; color: var(--secondary-text); margin-bottom: 2rem; }
        .cta-button { display: inline-block; background-color: var(--accent-color); color: white; padding: 1rem 2.5rem; font-size: 1.1rem; font-weight: bold; text-decoration: none; border: none; border-radius: 6px; cursor: pointer; transition: background-color 0.2s ease-in-out, transform 0.2s ease; }
        .cta-button:hover { background-color: var(--accent-hover); transform: translateY(-2px); }
        .telegram-btn { background-color: #2AABEE; }
        .telegram-btn:hover { background-color: #47bcf1; }

        #video-gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 2rem; padding: 4rem 0; }
        .video-card { background-color: #161b22; border: 1px solid var(--border-color); border-radius: 8px; text-align: center; overflow: hidden; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
        .video-card:hover { transform: translateY(-5px); box-shadow: 0 8px 20px rgba(0,0,0,0.4); }
        .video-thumbnail { position: relative; width: 100%; aspect-ratio: 16 / 9; background-color: #010409; background-size: cover; background-position: center; }
        .play-button-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 60px; height: 60px; background-color: rgba(0,0,0,0.5); border: 2px solid white; border-radius: 50%; display: flex; justify-content: center; align-items: center; transition: background-color 0.2s; }
        .play-button-overlay::after { content: ''; border-style: solid; border-width: 12px 0 12px 20px; border-color: transparent transparent transparent white; margin-left: 5px; }
        .video-card:hover .play-button-overlay { background-color: rgba(47,129,247,0.7); }
        .video-card h3 { padding: 1rem 1rem 0 1rem; color: var(--accent-hover); }
        .video-card p { font-size: 0.9rem; color: var(--secondary-text); padding: 0 1rem 1rem 1rem; }

        .lightbox { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.9); }
        .lightbox.active { display: flex; justify-content: center; align-items: center; }
        .lightbox-content { position: relative; margin: auto; padding: 20px; width: 90%; max-width: 900px; }
        .lightbox-content video { width: 100%; height: auto; }
        .lightbox-close { position: absolute; top: 20px; right: 35px; color: #f1f1f1; font-size: 40px; font-weight: bold; transition: 0.3s; }
        .lightbox-close:hover, .lightbox-close:focus { color: #bbb; text-decoration: none; cursor: pointer; }
        
        footer { text-align: center; padding: 2rem 1rem; font-size: 0.8rem; color: var(--secondary-text); border-top: 1px solid var(--border-color); }
    </style>
</head>
<body>

    <header>
        <h1>TECHNIQUE SHOWCASE</h1>
    </header>

    <main>
        <section id="video-gallery">
            <!-- I am using root-relative paths. This is the most reliable way. -->
            <div class="video-card" data-video-src="assets/teaser1.mp4">
                <div class="video-thumbnail"><div class="play-button-overlay"></div></div>
                <h3>Demo 1</h3>
                <p>.</p>
            </div>
            <div class="video-card" data-video-src="/assets/teaser2.mp4">
                <div class="video-thumbnail"><div class="play-button-overlay"></div></div>
                <h3>Demo 2</h3>
                <p></p>
            </div>
            <div class="video-card" data-video-src="/assets/teaser3.mp4">
                <div class="video-thumbnail"><div class="play-button-overlay"></div></div>
                <h3>Demo 3</h3>
                <p>.</p>
            </div>
        </section>

        <section id="final-cta">
            <h2>i have made full Tutorial with live demo hacking accounts like instagram,microsoft etc.For any quize contact me</h2>
            <p>Start Today. Start mastering.</p>
            <a href="https://t.me/simplerhacking" target="_blank" class="cta-button telegram-btn">Message me on Telegram</a>
        </section>
    </main>

    <div id="video-lightbox" class="lightbox">
        <span class="lightbox-close">&times;</span>
        <div class="lightbox-content">
            <video id="lightbox-video" controls preload="auto"></video>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 - All Rights Reserved. For Educational & Research Purposes Only.</p>
    </footer>

    <!-- ALL JAVASCRIPT IS NOW EMBEDDED DIRECTLY IN THIS FILE -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const lightbox = document.getElementById('video-lightbox');
            const lightboxVideo = document.getElementById('lightbox-video');
            const videoCards = document.querySelectorAll('.video-card');
            const closeBtn = document.querySelector('.lightbox-close');

            if (lightbox) {
                videoCards.forEach(card => {
                    card.addEventListener('click', () => {
                        const videoSrc = card.getAttribute('data-video-src');
                        lightboxVideo.src = videoSrc;
                        lightbox.classList.add('active');
                        lightboxVideo.play();
                    });
                });

                const closeLightbox = () => {
                    lightbox.classList.remove('active');
                    lightboxVideo.pause();
                    lightboxVideo.src = "";
                };

                closeBtn.addEventListener('click', closeLightbox);
                lightbox.addEventListener('click', (event) => {
                    if (event.target === lightbox) {
                        closeLightbox();
                    }
                });
            }
        });
    </script>
</body>
</html>
